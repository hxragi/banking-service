[package]
name = "bank-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.102", default-features = false }
async-trait = { version = "0.1.89", default-features = false }
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
prometheus = { version = "0.14.0", default-features = false }
config = { version = "0.15.22", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.31.1", features = ["http-json", "trace", "reqwest-client"] }
opentelemetry-semantic-conventions = { version = "0.31", default-features = false }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
prost = { version = "0.14.3", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate"] }
thiserror = { version = "2.0.18", default-features = false }
time = { version = "0.3.47", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14.5", default-features = false, features = ["codegen", "server", "channel", "router"] }
tonic-prost = { version = "0.14.5", default-features = false }
tonic_include_protos = { version = "0.1.2", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = { version = "0.1.44", default-features = false }
tracing-opentelemetry = { version = "0.32.1", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "std"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
rand = { version = "0.10.1", default-features = false, features = ["thread_rng"] }
rdkafka = { version = "0.39.0", features = ["tokio", "ssl-vendored"] }
sentry = { version = "0.47.0", features = ["tracing"], default-features = false }
sentry-tracing = { version = "0.47.0", default-features = false }
redis = { version = "1.2.0", features = ["tokio-comp"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto", "use_pem"] }

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }

[build-dependencies]
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"
