[package]
name = "bank-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
config = "0.15.22"
dotenvy = "0.15.7"
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate"] }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.50.0", features = ["full"] }
tonic = "0.14.5"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }

[build-dependencies]
tonic-build = "0.14.5"
